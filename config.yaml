mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "HY2-Mac"
    type: hysteria2
    server: 173.242.119.252
    port: 443
    password: "mac:ed85784f732d614e3af8f4079cf1cba1"
    sni: bing.com
    skip-cert-verify: true
    up: "50 Mbps"
    down: "400 Mbps"

  - name: "HY2-iPhone"
    type: hysteria2
    server: 173.242.119.252
    port: 443
    password: "iphone:c4ffa9e8df4f4fa5f4b312ac48e719b6"
    sni: bing.com
    skip-cert-verify: true
    up: "50 Mbps"
    down: "400 Mbps"

  - name: "VLESS-Reality-备用"
    type: vless
    server: 173.242.119.252
    port: 443
    uuid: f7cf2aa5-279f-4c44-87f5-2983d0fa3c6f
    network: tcp
    udp: true
    flow: xtls-rprx-vision
    tls: true
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 3f5U-iIm7xus9rTjnyJROmWa5glCxHrIH_YEJL-ECTA
      short-id: f4e2f903

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "HY2-Mac"
      - "HY2-iPhone"
      - "VLESS-Reality-备用"
      - DIRECT

rules:
  - GEOSITE,private,DIRECT
  - GEOSITE,cn,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,节点选择
